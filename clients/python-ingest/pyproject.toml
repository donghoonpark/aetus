[project]
name = "aetus-ingest-client"
version = "0.1.0"
description = "Python client SDK for AETUS protobuf ingest"
readme = "README.md"
authors = [
    { name = "donghoonpark", email = "donghun94@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "protobuf>=6.30.0",
]
keywords = ["aetus", "protobuf", "telemetry", "iot", "ingest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/donghoonpark/aetus"
Repository = "https://github.com/donghoonpark/aetus"
Issues = "https://github.com/donghoonpark/aetus/issues"
Documentation = "https://github.com/donghoonpark/aetus/tree/main/docs"

[dependency-groups]
dev = [
    "psycopg[binary]>=3.2.9",
    "pytest>=8.4.1",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"
