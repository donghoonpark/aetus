[package]
name = "aetus-ingest-client"
version = "0.1.0"
edition = "2021"
description = "Rust client SDK for AETUS protobuf ingest"
license = "MIT"

[dependencies]
prost = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3"

[dev-dependencies]
httpmock = "0.8"
postgres = "0.19"
serde_json = "1"
