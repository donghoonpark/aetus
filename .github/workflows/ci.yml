name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/ingest-control-panel
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/ingest-control-panel/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build control panel
        run: npm run build

  ingest-unit:
    name: Ingest API unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingest-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Show preinstalled build tools
        run: |
          cmake --version
          gcc --version
          g++ --version
          make --version

      - name: Install uv
        run: python -m pip install uv==0.8.22

      - name: Install Python dependencies
        run: uv sync --locked --group dev

      - name: Run unit tests
        run: uv run pytest tests/unit -q

  e2e:
    name: Docker Compose e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/ingest-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Show preinstalled build tools
        run: |
          cmake --version
          gcc --version
          g++ --version
          make --version

      - name: Install uv
        run: python -m pip install uv==0.8.22

      - name: Install Python dependencies
        run: uv sync --locked --group dev

      - name: Show Docker Compose version
        run: docker compose version

      - name: Run e2e pipeline test
        run: uv run pytest tests/e2e -q

      - name: Tear down e2e stack
        if: always()
        working-directory: ${{ github.workspace }}
        run: docker compose -f compose/e2e-compose.yml down -v --remove-orphans
