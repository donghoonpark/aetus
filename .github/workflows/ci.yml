name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ingest-control-panel:
    name: Ingest control panel build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/ingest-control-panel
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/ingest-control-panel/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build control panel
        run: npm run build

  stream-viewer:
    name: Stream viewer build and e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/stream-viewer
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/stream-viewer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build stream viewer
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run stream viewer e2e
        run: npm run test:e2e

  ingest-unit:
    name: Ingest API unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingest-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Show preinstalled build tools
        run: |
          cmake --version
          gcc --version
          g++ --version
          make --version

      - name: Install uv
        run: python -m pip install uv==0.8.22

      - name: Install Python dependencies
        run: uv sync --locked --group dev

      - name: Run unit tests
        run: uv run pytest tests/unit -q

  query-api:
    name: Query API unit and e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/query-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv==0.8.22

      - name: Install Python dependencies
        run: uv sync --locked --group dev

      - name: Show Docker Compose version
        run: docker compose version

      - name: Run query API tests
        run: uv run pytest -q

      - name: Tear down query stack
        if: always()
        working-directory: ${{ github.workspace }}
        run: docker compose -f compose/e2e-compose.yml down -v --remove-orphans

  python-ingest-client:
    name: Python ingest client unit and e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: clients/python-ingest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv==0.8.22

      - name: Install Python dependencies
        run: uv sync --locked --group dev

      - name: Show Docker Compose version
        run: docker compose version

      - name: Run Python ingest client tests
        run: uv run pytest -q

      - name: Tear down Python client e2e stack
        if: always()
        working-directory: ${{ github.workspace }}
        run: docker compose -f compose/e2e-compose.yml down -v --remove-orphans

  rust-ingest-client:
    name: Rust ingest client unit and e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: clients/rust-ingest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/rust-ingest

      - name: Show Docker Compose version
        run: docker compose version

      - name: Run Rust ingest client tests
        env:
          AETUS_RUST_E2E_BUILD: "1"
        run: cargo test -- --test-threads=1

      - name: Tear down Rust client e2e stack
        if: always()
        working-directory: ${{ github.workspace }}
        run: docker compose -f compose/e2e-compose.yml down -v --remove-orphans

  e2e:
    name: Docker Compose e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/ingest-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Show preinstalled build tools
        run: |
          cmake --version
          gcc --version
          g++ --version
          make --version

      - name: Install uv
        run: python -m pip install uv==0.8.22

      - name: Install Python dependencies
        run: uv sync --locked --group dev

      - name: Show Docker Compose version
        run: docker compose version

      - name: Run e2e pipeline test
        run: uv run pytest tests/e2e -q

      - name: Tear down e2e stack
        if: always()
        working-directory: ${{ github.workspace }}
        run: docker compose -f compose/e2e-compose.yml down -v --remove-orphans
