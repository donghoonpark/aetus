name: Firmware Test Apps Build

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/firmware-test-apps.yml"
      - "firmware/esp32-aetus/**"
      - "firmware/test-apps/**"
  pull_request:
    paths:
      - ".github/workflows/firmware-test-apps.yml"
      - "firmware/esp32-aetus/**"
      - "firmware/test-apps/**"
  workflow_dispatch:

concurrency:
  group: firmware-test-apps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: qemu-telemetry
            path: firmware/test-apps/qemu-telemetry
            target: esp32c3
          - name: qemu-signal-pool
            path: firmware/test-apps/qemu-signal-pool
            target: esp32c3
          - name: esp32c5-upload-smoke
            path: firmware/test-apps/esp32c5-upload-smoke
            target: esp32c5
          - name: esp32c5-isr-enqueue
            path: firmware/test-apps/esp32c5-isr-enqueue
            target: esp32c5
          - name: signal-frame-contract
            path: firmware/test-apps/signal-frame-contract
            target: esp32c5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build ESP-IDF test app
        env:
          AETUS_WIFI_SSID: ci-ssid
          AETUS_WIFI_PASSWORD: ci-password
          AETUS_INGEST_URL: http://ingest.internal/v1/ingest
          AETUS_DEVICE_ID: esp32c5-ci-test-app
          AETUS_DEVICE_TOKEN: devtok_ci_test_app
        run: |
          docker run --rm \
            -e AETUS_WIFI_SSID \
            -e AETUS_WIFI_PASSWORD \
            -e AETUS_INGEST_URL \
            -e AETUS_DEVICE_ID \
            -e AETUS_DEVICE_TOKEN \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace \
            espressif/idf:release-v6.0 \
            bash -lc '. "$IDF_PATH/export.sh" && idf.py -C "${{ matrix.app.path }}" -B "${{ matrix.app.path }}/build-ci" set-target "${{ matrix.app.target }}" build'

  negative-builds:
    name: Negative compile checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Reject overlong C++ metric key literals
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace \
            espressif/idf:release-v6.0 \
            bash -lc '
              set +e
              . "$IDF_PATH/export.sh"
              idf.py -C firmware/test-apps/cpp-literal-limit-negative -B firmware/test-apps/cpp-literal-limit-negative/build-ci set-target esp32c5 build > /tmp/aetus-cpp-literal-limit.log 2>&1
              status=$?
              set -e
              cat /tmp/aetus-cpp-literal-limit.log
              if [ "$status" -eq 0 ]; then
                echo "Expected overlong C++ metric key literal build to fail"
                exit 1
              fi
              grep -q "AETUS metric key literal is too long" /tmp/aetus-cpp-literal-limit.log
            '
