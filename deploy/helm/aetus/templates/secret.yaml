{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aetus.secretName" . }}
  labels:
    {{- include "aetus.labels" . | nindent 4 }}
type: Opaque
stringData:
  bootstrap-token: {{ .Values.secrets.bootstrapToken | quote }}
  device-tokens: {{ .Values.secrets.deviceTokens | quote }}
  admin-password: {{ .Values.secrets.adminPassword | quote }}
  query-jwt-secret: {{ .Values.secrets.queryJwtSecret | quote }}
  query-admin-token: {{ .Values.secrets.queryAdminToken | quote }}
  anomaly-admin-token: {{ .Values.secrets.anomalyAdminToken | quote }}
  postgres-password: {{ default .Values.secrets.postgresPassword .Values.postgres.external.password | quote }}
  postgres-dsn: {{ include "aetus.postgresDsn" . | quote }}
{{- end }}
