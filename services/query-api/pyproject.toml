[project]
name = "aetus-query"
version = "0.1.0"
description = "FastAPI query server for AETUS stream visualization"
authors = [
    { name = "donghoonpark", email = "donghun94@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.0",
    "PyJWT>=2.10.1",
    "psycopg[binary,pool]>=3.2.9",
    "redis>=6.0.0",
    "uvicorn>=0.35.0",
]

[project.scripts]
aetus-query = "aetus_query.main:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.1",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"
