[project]
name = "aetus-ingest"
version = "0.1.0"
description = "FastAPI ingest server for ESP32-C5 protobuf telemetry"
authors = [
    { name = "donghoonpark", email = "donghun94@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.0",
    "kafka-python-ng>=2.2.3",
    "protobuf>=6.30.0",
    "uvicorn>=0.35.0",
]

[project.scripts]
aetus-ingest = "aetus_ingest.main:main"

[dependency-groups]
dev = [
    "grpcio-tools>=1.74.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2.9",
    "pytest>=8.4.1",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"
