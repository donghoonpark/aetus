services:
  postgres:
    build:
      context: ../services/postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aetus}
      POSTGRES_USER: ${POSTGRES_USER:-aetus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aetus}
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aetus -d aetus"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    build:
      context: ../services/kafka
    ports:
      - "19092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-connect:
    build:
      context: ../services/kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "18083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_GROUP_ID: aetus-connect
      CONNECT_CONFIG_STORAGE_TOPIC: aetus-connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: aetus-connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: aetus-connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "true"
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_PLUGIN_PATH: /usr/share/confluent-hub-components
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/ >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20

  connector-init:
    image: curlimages/curl:8.12.1
    depends_on:
      kafka-connect:
        condition: service_healthy
    environment:
      PG_CONNECTION_URL: ${PG_CONNECTION_URL:-jdbc:postgresql://postgres:5432/aetus}
      PG_CONNECTION_USER: ${PG_CONNECTION_USER:-aetus}
      PG_CONNECTION_PASSWORD: ${PG_CONNECTION_PASSWORD:-aetus}
    volumes:
      - ../services/kafka-connect/connectors:/config/connectors:ro
    entrypoint:
      - sh
      - -c
      - |
        until curl -fsS http://kafka-connect:8083/; do sleep 2; done
        for config in /config/connectors/*.json; do
          tmp=$$(mktemp)
          sed \
            -e "s|\$${PG_CONNECTION_URL}|$${PG_CONNECTION_URL}|g" \
            -e "s|\$${PG_CONNECTION_USER}|$${PG_CONNECTION_USER}|g" \
            -e "s|\$${PG_CONNECTION_PASSWORD}|$${PG_CONNECTION_PASSWORD}|g" \
            "$$config" > "$$tmp"
          curl -fsS -X POST http://kafka-connect:8083/connectors \
            -H 'Content-Type: application/json' \
            --data @"$$tmp"
          rm -f "$$tmp"
        done

  ingest-api:
    build:
      context: ../services/ingest-api
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      AETUS_PUBLISHER_BACKEND: kafka
      AETUS_BOOTSTRAP_TOKEN: ${AETUS_BOOTSTRAP_TOKEN:-bootstrap_shared_token}
      AETUS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AETUS_KAFKA_TOPIC: device.raw.v1
      AETUS_KAFKA_METRIC_TOPIC: device.metric.v1
      AETUS_KAFKA_SIGNAL_FRAME_TOPIC: device.signal_frame.v1
      AETUS_KAFKA_CONNECT_URL: http://kafka-connect:8083
      AETUS_POSTGRES_DSN: ${AETUS_POSTGRES_DSN:-postgresql://aetus:aetus@postgres:5432/aetus}
      AETUS_ADMIN_PASSWORD: ${AETUS_ADMIN_PASSWORD:-}
      AETUS_ALLOWED_SOURCE_CIDRS: 0.0.0.0/0
      AETUS_DEVICE_TOKENS: esp32c5-test-001=devtok_test_001
      AETUS_ALLOWLIST_DEVICE_IDS: ""
      AETUS_ALLOWED_HARDWARE_IDS: esp32c5-a1b2c3d4e5f6
      AETUS_CONTROL_DB_BACKEND: sqlite
      AETUS_CONTROL_DB_PATH: /data/control.db
      AETUS_CONTROL_DB_BACKUP_DIR: /data/control-backups
      AETUS_CONTROL_DB_BACKUP_INTERVAL_SECONDS: 3600
      AETUS_CONTROL_DB_BACKUP_RETENTION_COUNT: 48
      AETUS_HOST: 0.0.0.0
      AETUS_PORT: 8000
    volumes:
      - ingest-control-data:/data
    ports:
      - "18000:8000"

  query-api:
    build:
      context: ../services/query-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AETUS_POSTGRES_DSN: ${AETUS_POSTGRES_DSN:-postgresql://aetus:aetus@postgres:5432/aetus}
      AETUS_QUERY_REDIS_URL: ${AETUS_QUERY_REDIS_URL:-redis://redis:6379/0}
      AETUS_HOST: 0.0.0.0
      AETUS_PORT: 8000
    ports:
      - "18001:8000"

volumes:
  ingest-control-data:
